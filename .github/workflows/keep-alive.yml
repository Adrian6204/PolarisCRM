name: Keep Database Alive

on:
  schedule:
    # Runs every 3 days at 08:00 UTC to prevent Supabase from pausing (7-day inactivity rule)
    - cron: "0 8 */3 * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    name: Ping Health Endpoint & DB
    runs-on: ubuntu-latest

    steps:
      - name: Ping Health Endpoint
        run: |
          TARGET_URL="${{ secrets.APP_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://polariscrm-two.vercel.app"
          fi
          
          ENDPOINT="${TARGET_URL%/}/api/health"
          echo "Pinging $ENDPOINT..."
          
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" -H "User-Agent: GitHub-Actions-KeepAlive" "$ENDPOINT")
          echo "Health check HTTP status: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Database and app are alive!"
          else
            echo "❌ Unexpected status: $STATUS"
            exit 1
          fi
