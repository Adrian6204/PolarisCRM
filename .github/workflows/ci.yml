name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lint → test → build gate (SPEC Phase 0). Build compiles the app and runs
# `prisma generate`; it does not require a live database.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy values so env.ts validation and prisma generate pass in CI.
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/ci?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret-value-not-used
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
